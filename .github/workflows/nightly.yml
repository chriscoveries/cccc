name: Dispatch regression control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assertion-red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Exercise idle tick without the dispatch action
        run: cargo test --package cccc-core --test integration --locked task_dispatch::idle_dispatch_rule_is_explicitly_enabled_on_the_existing_tick -- --exact --nocapture
