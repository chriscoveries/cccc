name: Nightly
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to build
        required: true
        type: string
permissions:
  contents: read
jobs:
  stage-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Require an immutable source commit
        run: python3 -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}",os.environ["SOURCE_REF"])'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify runtime source identity
        run: python3 -c 'import os,subprocess; assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==os.environ["SOURCE_REF"]'
      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify the turn probe and managed-authority controls
        run: cargo test --workspace --lib --locked turn_probe
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the bundled Web interface
        run: npm ci --prefix web && npm -C web run build
      - name: Build the standalone binary
        run: cargo build --package cccc --release --locked --features standalone
      - name: Record artifact provenance
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,subprocess
          from pathlib import Path
          binary=Path('target/release/cccc')
          record={'source_commit':os.environ['SOURCE_REF'],'build_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'workflow_commit':os.environ['GITHUB_SHA'],'workflow_ref':os.environ['GITHUB_WORKFLOW_REF'],'run_id':os.environ['GITHUB_RUN_ID'],'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'source_delta':'none; exact source commit checked out and verified'}
          Path('PROVENANCE.json').write_text(json.dumps(record,indent=2)+'\n')
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: hermes-turn-probe-linux
          path: |
            target/release/cccc
            PROVENANCE.json
          if-no-files-found: error
