name: Nightly
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify runtime source identity
        run: git diff --exit-code c68a3f5ef874a2d7fb73b6658df33238c82a0102 HEAD -- . ':(exclude).github/workflows/nightly.yml'
      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the bundled Web interface
        run: npm ci --prefix web && npm -C web run build
      - name: Build the standalone binary
        run: cargo build --package cccc --release --locked --features standalone
      - name: Record artifact provenance
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,subprocess
          from pathlib import Path
          binary=Path('target/release/cccc')
          record={'source_commit':'c68a3f5ef874a2d7fb73b6658df33238c82a0102','build_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'run_id':os.environ['GITHUB_RUN_ID'],'binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'source_delta':'workflow-only; verified by git diff'}
          Path('PROVENANCE.json').write_text(json.dumps(record,indent=2)+'\n')
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: hermes-turn-probe-linux
          path: |
            target/release/cccc
            PROVENANCE.json
          if-no-files-found: error
