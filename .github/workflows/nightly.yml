name: Dispatch admission regression control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assertion-red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Exercise commit admission, manual undo, and delivery refs without their guards
        run: |
          cargo test --package cccc-pair-core --test integration --locked task_dispatch:: -- --nocapture
