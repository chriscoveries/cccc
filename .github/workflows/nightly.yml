name: Nightly
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  captured-lease-baseline-control:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce the native-terminal unknown projection with a real lease capture
        shell: bash
        run: |
          set -o pipefail
          cargo test --package cccc-pair-daemon --lib --locked captured_hermes_lease_populates_existing_working_fields -- --nocapture 2>&1 | tee captured-lease-red.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captured-lease-red
          path: captured-lease-red.log
          if-no-files-found: error
