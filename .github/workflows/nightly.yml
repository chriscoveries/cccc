name: Turn usage regression control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Assert settled turns reach the Group ledger
        run: cargo test --workspace --lib --locked captured_pi_and_claude_turn_usage_is_committed_once_and_readable -- --nocapture
