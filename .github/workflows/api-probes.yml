name: Recorded API probes

on:
  push:
    branches: [test/api-guard-filter-probes]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  daemon-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: stock
            source: 8b708d8c4f29245a547cb0779e0b32d08eb5395b
            features: "task-revision ledger-search-filters"
            candidate: ""
          - label: main
            source: 3d3d10cb3906dc353a7d421541b6c6ec98a6d04d
            features: "task-revision ledger-search-filters"
            candidate: ""
          - label: task-revision
            source: be5814ef311f62b3ac764395b906c5e486b03897
            features: "task-revision"
            candidate: "--candidate"
          - label: ledger-search-filters
            source: 564c46be46907e5e1ff68bf74f471835926e9108
            features: "ledger-search-filters"
            candidate: "--candidate"
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
      - name: Check the immutable build run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: ${{ matrix.label }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/39758031417" > build-run.json
          gh api "repos/$GH_REPO/actions/runs/39758031417/jobs?per_page=100" > build-jobs.json
          python3 - <<'PYTHON'
          import json, os
          run = json.load(open('build-run.json'))
          assert run['head_sha'] == '57d2aaf7111e3d269970366211537e2bd84811c3'
          assert run['status'] == 'completed'
          assert run['repository']['full_name'] == 'chriscoveries/cccc'
          jobs = json.load(open('build-jobs.json'))['jobs']
          job = next(job for job in jobs if job['name'].startswith('daemon-api ('+os.environ['LABEL']+','))
          build = next(step for step in job['steps'] if step['name'] == 'Assert source and build the daemon binary')
          assert build['conclusion'] == 'success'
          PYTHON
      - name: Download the source-bound built binary
        uses: actions/download-artifact@v8
        with:
          name: api-probe-${{ matrix.label }}
          path: prior-build
          run-id: 39758031417
          github-token: ${{ github.token }}
      - name: Verify and preserve the original binary binding
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, shutil
          prior = pathlib.Path('prior-build')
          binary = prior/'source/target/debug/cccc'
          sha = hashlib.sha256(binary.read_bytes()).hexdigest()
          recorded_sha = (prior/'evidence/binary.sha256').read_text().split()[0]
          assert sha == recorded_sha
          reports = list((prior/'evidence').glob('*/report.json'))
          assert reports
          for path in reports:
              report = json.loads(path.read_text())
              assert report['source'] == os.environ['EXPECTED_SOURCE']
              assert report['sha256'] == sha
          destination = pathlib.Path('source/target/debug/cccc')
          destination.parent.mkdir(parents=True)
          shutil.copyfile(binary, destination)
          destination.chmod(0o755)
          pathlib.Path('evidence').mkdir()
          shutil.copyfile('build-run.json', 'evidence/build-run.json')
          shutil.copyfile('build-jobs.json', 'evidence/build-jobs.json')
          binding = {'build_run': 39758031417, 'build_run_head': '57d2aaf7111e3d269970366211537e2bd84811c3', 'source': os.environ['EXPECTED_SOURCE'], 'binary_sha256': sha, 'prior_reports': [str(p) for p in reports]}
          pathlib.Path('evidence/reused-build.json').write_text(json.dumps(binding, indent=2)+'\n')
          PYTHON
      - name: Run recorded API probes
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
          FEATURES: ${{ matrix.features }}
          CANDIDATE: ${{ matrix.candidate }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          sha256sum source/target/debug/cccc | tee evidence/binary.sha256
          uname -a > evidence/host.txt
          lscpu >> evidence/host.txt
          for feature in $FEATURES; do
            fixture=tasks.json
            if [ "$feature" = ledger-search-filters ]; then fixture=events.json; fi
            set +e
            python3 harness/scripts/tests/api_probes/probe.py \
              --binary source/target/debug/cccc \
              --sha256 "$(sha256sum source/target/debug/cccc | cut -d' ' -f1)" \
              --source "$EXPECTED_SOURCE" --feature "$feature" \
              --fixture "harness/scripts/tests/api_probes/$fixture" \
              --output "evidence/$feature"
            probe_exit=$?
            set -e
            printf '%s\n' "$probe_exit" > "evidence/$feature/probe.exit"
            if [ -n "$CANDIDATE" ]; then test "$probe_exit" = 0; else test "$probe_exit" = 1; fi
            python3 harness/scripts/tests/api_probes/verify.py \
              --report "evidence/$feature/report.json" \
              --source "$EXPECTED_SOURCE" $CANDIDATE > "evidence/$feature/verdict.json"
            cat "evidence/$feature/verdict.json"
          done
      - name: Preserve raw RPC evidence and binary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-probe-${{ matrix.label }}
          path: |
            evidence
            source/target/debug/cccc
          if-no-files-found: error
          retention-days: 3
