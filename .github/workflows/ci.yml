name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8c573a73450587988740b05af1834cf533501f8e
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 39638158450
          name: bundled-web
          path: web/dist
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build replay CLI from the reviewed source
        run: |
          git rev-parse HEAD > replay-source.txt
          cargo test --locked --package cccc-pair-core --lib
          cargo test --locked --package cccc-pair-core --test integration
          cargo test --locked --package cccc --test inbox_projection
          cargo build --locked --package cccc --bin cccc
          sha256sum target/debug/cccc > replay-binary.sha256
          python3 - <<'PY'
          import pathlib, shutil, subprocess
          root = pathlib.Path('replay-oracle')
          root.mkdir()
          binaries = []
          for path in pathlib.Path('target/debug/deps').glob('cccc_core-*'):
              if path.is_file() and path.suffix == '' and path.stat().st_mode & 0o111:
                  listed = subprocess.run([str(path), '--list'], capture_output=True, text=True, check=True).stdout
                  if 'real_group_notices_match_history_without_warm_projection_decodes' in listed:
                      binaries.append(path)
          assert len(binaries) == 1, binaries
          shutil.copyfile(binaries[0], root / 'cccc-core-tests')
          PY
          sha256sum replay-oracle/cccc-core-tests > replay-oracle.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: inbox-replay-cli
          path: |
            target/debug/cccc
            replay-source.txt
            replay-binary.sha256
            replay-oracle/cccc-core-tests
            replay-oracle.sha256

  replay-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: before
            ref: 080d8db6bdd39a3c81bbf6f6ef2c26cee97eb417
          - name: after
            ref: 8c573a73450587988740b05af1834cf533501f8e
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 39638158450
          name: bundled-web
          path: web/dist
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build comparable release replay CLI
        run: |
          git rev-parse HEAD > replay-source.txt
          cargo build --release --locked --package cccc --bin cccc
          sha256sum target/release/cccc > replay-binary.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: inbox-replay-cli-${{ matrix.name }}
          path: |
            target/release/cccc
            replay-source.txt
            replay-binary.sha256
