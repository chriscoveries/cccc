name: Native I/O proof helper
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact unchanged daemon source parent
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Build and check test-only probe
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: /usr/bin/bash .github/proof/build-probe.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-io-proof-helper
          path: probe-artifact/
          if-no-files-found: error
          retention-days: 1
