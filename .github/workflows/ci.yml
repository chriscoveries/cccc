name: CI
run-name: Runtime artifact ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime-artifact:
    if: github.repository == 'chriscoveries/cccc'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - name: Validate source commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_sha must be a full lowercase commit SHA' >&2
            exit 1
          fi

      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          repository: chriscoveries/cccc
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f Cargo.lock
          test -f web/package-lock.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix web
          npm -C web run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Build Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --package cccc --bin cccc --locked

      - name: Bind runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -x target/debug/cccc
          mkdir runtime-artifact
          install -m 0755 target/debug/cccc runtime-artifact/cccc
          rustc -vV > runtime-artifact/rustc.txt
          target=$(sed -n 's/^host: //p' runtime-artifact/rustc.txt)
          test "$target" = x86_64-unknown-linux-gnu
          binary_sha=$(sha256sum runtime-artifact/cccc)
          binary_sha=${binary_sha%% *}
          jq -n   --arg source_repo "$GITHUB_REPOSITORY"   --arg source_sha "$SOURCE_SHA"   --arg workflow_sha "$WORKFLOW_SHA"   --arg workflow_ref "$WORKFLOW_REF"   --arg run_id "$GITHUB_RUN_ID"   --arg run_attempt "$GITHUB_RUN_ATTEMPT"   --arg target "$target"   --arg binary_sha256 "$binary_sha"   '{schema_version: 1, source_repo: $source_repo, source_sha: $source_sha,
              workflow_sha: $workflow_sha, workflow_ref: $workflow_ref,
              run_id: $run_id, run_attempt: $run_attempt, target: $target,
              binary: "cccc", binary_sha256: $binary_sha256}'   > runtime-artifact/build.json
          (cd runtime-artifact && sha256sum cccc build.json rustc.txt > SHA256SUMS)

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: cccc-linux-${{ inputs.source_sha }}
          path: runtime-artifact
          if-no-files-found: error
          retention-days: 1
