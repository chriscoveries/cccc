name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 94af181520ec41d6b4c0af4e912930ee1cc64b57
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 39676405937
          name: bundled-web
          path: web/dist
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build replay CLI from the reviewed source
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = 94af181520ec41d6b4c0af4e912930ee1cc64b57
          git rev-parse HEAD > replay-source.txt
          git rev-parse HEAD^{tree} > replay-tree.txt
          git rev-parse HEAD:web > replay-web-tree.txt
          cargo fmt --all --check 2>&1 | tee fmt.log
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee full-suite.log
          python3 - <<'PY'
          import pathlib, shutil, subprocess
          root = pathlib.Path('replay-oracle')
          root.mkdir()
          binaries = []
          for path in pathlib.Path('target/debug/deps').glob('cccc_core-*'):
              if path.is_file() and path.suffix == '' and path.stat().st_mode & 0o111:
                  listed = subprocess.run([str(path), '--list'], capture_output=True, text=True, check=True).stdout
                  if 'real_group_notices_match_history_without_warm_projection_decodes' in listed:
                      binaries.append(path)
          assert len(binaries) == 1, binaries
          shutil.copyfile(binaries[0], root / 'cccc-core-tests')
          startup = []
          for path in pathlib.Path('target/debug/deps').glob('cccc_daemon-*'):
              if path.is_file() and path.suffix == '' and path.stat().st_mode & 0o111:
                  listed = subprocess.run([str(path), '--list'], capture_output=True, text=True, check=True).stdout
                  if 'real_group_startup_claims_match_history' in listed:
                      startup.append(path)
          assert len(startup) == 1, startup
          listed = subprocess.run([str(startup[0]), '--list'], capture_output=True, text=True, check=True).stdout
          assert 'real_group_delivery_queries_match_history' in listed
          shutil.copyfile(startup[0], root / 'cccc-daemon-tests')
          PY
          sha256sum replay-oracle/cccc-core-tests > replay-oracle.sha256
          sha256sum replay-oracle/cccc-daemon-tests > replay-startup-oracle.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-replay-oracles
          path: |
            replay-source.txt
            replay-tree.txt
            replay-web-tree.txt
            fmt.log
            clippy.log
            full-suite.log
            replay-oracle/cccc-core-tests
            replay-oracle.sha256
            replay-oracle/cccc-daemon-tests
            replay-startup-oracle.sha256
