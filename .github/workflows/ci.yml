name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 78368221d364347df478bb937912b280c6f1eb3b
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 39638158450
          name: bundled-web
          path: web/dist
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build replay CLI from the reviewed source
        run: |
          git rev-parse HEAD > replay-source.txt
          cargo test --locked --package cccc-pair-core --lib
          cargo test --locked --package cccc-pair-core --test integration
          cargo test --locked --package cccc --test inbox_projection
          cargo build --locked --package cccc --bin cccc
          sha256sum target/debug/cccc > replay-binary.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: inbox-replay-cli
          path: |
            target/debug/cccc
            replay-source.txt
            replay-binary.sha256
