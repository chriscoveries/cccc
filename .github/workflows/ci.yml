name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  notice-metadata-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 39638158450
          name: bundled-web
          path: web/dist
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build operator-input-only metadata probe
        run: |
          git rev-parse HEAD > probe-source.txt
          cargo test --locked --package cccc-pair-core --lib --no-run
          python3 - <<'PYCODE'
          import pathlib, shutil, subprocess
          root = pathlib.Path('notice-probe')
          root.mkdir()
          binaries = []
          for path in pathlib.Path('target/debug/deps').glob('cccc_core-*'):
              if path.is_file() and path.suffix == '' and path.stat().st_mode & 0o111:
                  listed = subprocess.run([str(path), '--list'], capture_output=True, text=True, check=True).stdout
                  if 'real_group_notice_retained_allocations' in listed:
                      binaries.append(path)
          assert len(binaries) == 1, binaries
          shutil.copyfile(binaries[0], root / 'cccc-core-tests')
          PYCODE
          sha256sum notice-probe/cccc-core-tests > notice-probe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: notice-metadata-probe
          path: |
            notice-probe/cccc-core-tests
            probe-source.txt
            notice-probe.sha256
