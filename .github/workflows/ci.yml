name: Release size comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-size-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build one shared Web bundle
        run: node scripts/prepare_rust_web_assets.mjs --install-deps
      - uses: actions/upload-artifact@v7
        with:
          name: comparison-web
          path: web/dist
          if-no-files-found: error

  measure:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: comparison-web
          path: web/dist
      - name: Install the same native dependencies as release CI
        run: dnf install -y cmake perl-core time
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-size-comparison
      - name: Measure the pinned source versions
        run: bash scripts/compare_release_sizes.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-size-results
          path: measurements
          if-no-files-found: error
