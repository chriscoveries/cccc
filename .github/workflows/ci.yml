name: Control dispatch verification

on:
  workflow_dispatch:
    inputs:
      proof:
        description: Fixed dispatch control
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify dispatch binding
        shell: bash
        env:
          INPUT_PROOF: ${{ inputs.proof }}
          CONTROL_SHA: ${{ github.sha }}
          CONTROL_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$INPUT_PROOF" = verified-control
          test "$CONTROL_REF" = refs/heads/control/slim-worker
          printf 'control_sha=%s\ncontrol_ref=%s\n' "$CONTROL_SHA" "$CONTROL_REF"
