name: Publisher scope verification

on:
  push:
    branches: [control/slim-worker]

permissions: {}

jobs:
  scopecheck:
    if: github.repository == 'chriscoveries/cccc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify branch and tag creation refusals
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          unset GIT_TRACE GIT_TRACE_PACKET GIT_TRACE_CURL GIT_CURL_VERBOSE
          repo=https://github.com/chriscoveries/cccc.git
          branch=refs/heads/control/rulecheck-token-20261031
          tag=refs/tags/rulecheck-token-20261031
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          git init --bare -q "$scratch/repo.git"
          git -C "$scratch/repo.git" fetch --no-tags --depth=1 "$repo" refs/heads/main
          commit=$(git -C "$scratch/repo.git" rev-parse 'FETCH_HEAD^{commit}')
          for ref in "$branch" "$tag"; do
            if git -C "$scratch/repo.git" ls-remote --exit-code "$repo" "$ref" >"$scratch/before"; then
              echo 'ref already exists; no write attempted' >&2
              exit 1
            else
              status=$?
              [ "$status" -eq 2 ] || { echo 'ref absence unknown' >&2; exit 1; }
            fi
            if git -C "$scratch/repo.git" -c 'credential.helper=!/usr/bin/gh auth git-credential' push "$repo" "$commit:$ref" >"$scratch/result" 2>&1; then
              echo "FAIL: unexpected create at $ref" >&2
              exit 1
            fi
            cat "$scratch/result"
            grep -Fq 'GH013: Repository rule violations' "$scratch/result"
            grep -Fq 'Cannot create ref due to creations being restricted' "$scratch/result"
            if git -C "$scratch/repo.git" ls-remote --exit-code "$repo" "$ref" >"$scratch/after"; then
              echo "FAIL: ref exists after refusal: $ref" >&2
              exit 1
            else
              status=$?
              [ "$status" -eq 2 ] || { echo 'ref readback unknown' >&2; exit 1; }
            fi
            echo "PASS: creation refused and ref absent: $ref"
          done
