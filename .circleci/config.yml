version: 2.1

jobs:
  test:
    machine: true
    resource_class: chriscoveries/claw
    steps:
      - run:
          name: claw admission gate (3 jobs max, 3 GiB floor)
          command: /usr/local/lib/claw-ci/gate.sh
      - checkout
      - run:
          name: ruff+pytest
          command: |
            python -m pip install --user ruff pytest && python -m ruff check scripts tests && python -m pytest -q

workflows:
  ci:
    jobs:
      - test
